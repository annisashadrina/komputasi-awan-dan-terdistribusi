<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Rancangan Private Cloud Sistem Data Kependudukan</title>
<desc id="desc">Instansi mengakses portal melalui jaringan aman dan kontrol akses. Portal terhubung ke database inti pada infrastruktur IaaS pemerintah dengan cadangan terenkripsi di lokasi pemulihan.</desc>
