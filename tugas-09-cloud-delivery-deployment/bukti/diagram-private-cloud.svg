<rect x="924" y="295" width="203" height="110" rx="10" fill="#fff" stroke="#aec7cb"/><text x="1025" y="329" font-size="17" font-weight="700">Database inti</text><text x="1025" y="355" font-size="14">NIK, alamat, biometrik</text><text x="1025" y="376" font-size="14">server &amp; storage IaaS</text>
